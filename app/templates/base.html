<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deteksi URL Phishing{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.5 2.8 8.3 7 10 4.2-1.7 7-5.5 7-10V6l-7-3Z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>Deteksi URL Phishing</span>
      </a>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="wrap footer-inner">
      <p>Hasil prediksi bersifat indikatif dan tidak menggantikan pemeriksaan manual.</p>
      <p>Dataset: LegitPhish Dataset Version 2</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
